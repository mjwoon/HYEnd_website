spring:
  application:
    name: hyend
  datasource:
    url: jdbc:h2:mem:hyend_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisReactiveAutoConfiguration
      - org.springframework.boot.data.redis.autoconfigure.health.DataRedisReactiveHealthContributorAutoConfiguration

# base64("testSecretKeyForTestingPurposesOnlyDoNotUseInProduction") — 55바이트 > HS256 최소 32바이트
jwt:
  secret: dGVzdFNlY3JldEtleUZvclRlc3RpbmdQdXJwb3Nlc09ubHlEb05vdFVzZUluUHJvZHVjdGlvbg==

file:
  storage:
    type: local
    local:
      upload-dir: /tmp/hyend-test-uploads
  allowed-extensions: jpg,jpeg,png,gif,pdf,docx,xlsx,pptx,hwp,zip
  max-file-count: 5

management:
  metrics:
    tags:
      application: hyend

logging:
  level:
    root: WARN
    com.hyend: INFO

livekit:
  api-key: test-key
  api-secret: test-secret-that-is-long-enough-32ch
  server-url: https://test.livekit.cloud

openai:
  api-key: test-openai-key
  whisper-model: whisper-1
  gpt-model: gpt-4o-mini

ai:
  quota:
    whisper-daily-seconds: 3600
    whisper-meeting-max-seconds: 10800
    llm-monthly-tokens: 100000
    llm-meeting-max-count: 3

meeting:
  invite:
    default-expire-hours: 24
    max-expire-hours: 168
