spring:
  profiles:
    active: dev
  application:
    name: hyend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000      # 15분 (ms)
  refresh-token-expiry: 604800000  # 7일 (ms)

book:
  rental-days: 7
  extension-days: 7

# 파일 저장소 설정
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}      # local | s3
    local:
      upload-dir: ./uploads
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:ap-northeast-2}
  allowed-extensions: jpg,jpeg,png,gif,pdf,docx,xlsx,pptx,hwp,zip
  max-file-count: 5                       # 요청당 최대 파일 수

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

logging:
  level:
    root: INFO
    com.hyend: DEBUG
    org.springframework.security: DEBUG

livekit:
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  server-url: ${LIVEKIT_SERVER_URL:https://your-project.livekit.cloud}

openai:
  api-key: ${OPENAI_API_KEY:}
  whisper-model: whisper-1
  gpt-model: gpt-4o-mini

webpush:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: mailto:admin@hyend.ac.kr

ai:
  quota:
    whisper-daily-seconds: 3600
    whisper-meeting-max-seconds: 10800
    llm-monthly-tokens: 100000
    llm-meeting-max-count: 3

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}

meeting:
  invite:
    default-expire-hours: 24
    max-expire-hours: 168
