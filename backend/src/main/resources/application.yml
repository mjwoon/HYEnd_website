spring:
  profiles:
    active: dev
  application:
    name: hyend
  datasource:
    hikari:
      pool-name: HyEndHikariPool
      maximum-pool-size: 10          # 최대 커넥션 수
      minimum-idle: 5                # 최소 유휴 커넥션 수
      connection-timeout: 10000      # 풀에서 커넥션 획득 대기 최대 (ms)
      validation-timeout: 5000       # 커넥션 유효성 검사 타임아웃 (ms)
      idle-timeout: 300000           # 유휴 커넥션 회수 (ms, 5분)
      keepalive-time: 120000         # 유휴 커넥션 keepalive (ms, 2분)
      max-lifetime: 1200000          # 커넥션 최대 수명 (ms, 20분)
  data:
    redis:
      timeout: 3000                  # Redis 명령 타임아웃 (ms)
      connect-timeout: 3000          # Redis 연결 타임아웃 (ms)
      lettuce:
        shutdown-timeout: 200        # 종료 대기 (ms)
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
      jakarta:
        persistence:
          query:
            timeout: 5000            # JPA 쿼리 타임아웃 (ms)
  transaction:
    default-timeout: 30s             # 전역 트랜잭션 기본 타임아웃 (타임아웃 미지정 @Transactional에 적용)
  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-migration-patterns: "*:missing"
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  tomcat:
    threads:
      max: 200                       # 최대 워커 스레드
      min-spare: 10                  # 최소 유휴 스레드
    accept-count: 100                # 스레드 포화 시 대기 큐 길이
    max-connections: 8192            # 동시 수용 커넥션 상한
    connection-timeout: 20000        # 커넥션 유휴 타임아웃 (ms)

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900000      # 15분 (ms)
  refresh-token-expiry: 604800000  # 7일 (ms)

book:
  rental-days: 7
  extension-days: 7

# 파일 저장소 설정
file:
  storage:
    type: ${FILE_STORAGE_TYPE:local}      # local | s3
    local:
      upload-dir: ./uploads
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_S3_REGION:ap-northeast-2}
  allowed-extensions: jpg,jpeg,png,gif,pdf,docx,xlsx,pptx,hwp,zip
  max-file-count: 5                       # 요청당 최대 파일 수

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus   # 노출 엔드포인트
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}          # 모든 메트릭에 애플리케이션 태그

logging:
  level:
    root: INFO
    com.hyend: DEBUG
    org.springframework.security: DEBUG

livekit:
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  server-url: ${LIVEKIT_SERVER_URL:https://your-project.livekit.cloud}

openai:
  api-key: ${OPENAI_API_KEY:}
  whisper-model: whisper-1
  gpt-model: gpt-4o-mini

webpush:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: mailto:admin@hyend.ac.kr

ai:
  quota:
    whisper-daily-seconds: 3600
    whisper-meeting-max-seconds: 10800
    llm-monthly-tokens: 100000
    llm-meeting-max-count: 3

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}

meeting:
  invite:
    default-expire-hours: 24
    max-expire-hours: 168
